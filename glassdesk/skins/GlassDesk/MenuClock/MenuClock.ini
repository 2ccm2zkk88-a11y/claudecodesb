[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=GlassDesk Menu Bar Clock
Information=Live day, date and time for a menu bar printed on the wallpaper. Sits at the top-left corner of the screen; the text is placed with ClockX and ClockY.

[Variables]
@Include=#@#Variables.inc
; Rainmeter already doubles everything at 200% display scaling, so this widget uses 1.
Scale=1
FontScale=1
; Nudge these in Notepad if the text doesn't line up with the bar.
; ClockX = right edge of the text, ClockY = vertical middle, ClockSize = text size.
ClockX=1377
ClockY=18.5
ClockSize=10
ClockColor=228,225,220,255

[MeasureTime]
Measure=Time
Format=%a %b %#d   %#I:%M %p

[ClockText]
Meter=String
MeasureName=MeasureTime
X=(#ClockX#*#Scale#)
Y=(#ClockY#*#Scale#)
StringAlign=RightCenter
FontFace=#Font#
FontSize=(#ClockSize#*#FontScale#)
FontWeight=500
FontColor=#ClockColor#
AntiAlias=1
SolidColor=0,0,0,1
LeftMouseUpAction=["ms-actioncenter:"]
ToolTipText=Open calendar and notifications
