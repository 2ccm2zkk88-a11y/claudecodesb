[Rainmeter]
Update=-1
AccurateText=1

[Metadata]
Name=GlassDesk Search
Information=Glass search widget sized for a Surface Pro 8.

[Variables]
@Include=#@#Variables.inc

[MeasureInput]
Measure=Plugin
Plugin=InputText
X=(54*#Scale#)
Y=(12*#Scale#)
W=(340*#Scale#)
H=(24*#Scale#)
FontFace=Segoe Fluent Icons
FontSize=13
FontColor=255,255,255
SolidColor=72,58,165
FocusDismiss=1
Command1=["search-ms:query=$UserInput$"]

[Pill]
Meter=Shape
Shape=Rectangle 0,0,(420*#Scale#),(48*#Scale#),(24*#Scale#) | Fill Color 255,255,255,70 | StrokeWidth (1*#Scale#) | Stroke Color #GlassEdge#
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]

[SearchIcon]
Meter=String
X=(22*#Scale#)
Y=(24*#Scale#)
StringAlign=LeftCenter
FontFace=#Font#
FontSize=(12*#FontScale#)
FontWeight=400
FontColor=#Text#
AntiAlias=1
Text=[\xE721]
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
[SearchLabel]
Meter=String
X=(54*#Scale#)
Y=(24*#Scale#)
StringAlign=LeftCenter
FontFace=Segoe Fluent Icons
FontSize=(13*#FontScale#)
FontWeight=400
FontColor=#Text#
AntiAlias=1
Text=Search
LeftMouseUpAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
[BtnApps]
Meter=Shape
Shape=Ellipse (456*#Scale#),(24*#Scale#),(24*#Scale#) | Fill Color 255,255,255,70 | StrokeWidth (1*#Scale#) | Stroke Color #GlassEdge#
LeftMouseUpAction=["explorer.exe" "shell:AppsFolder"]
ToolTipText=Apps

[IconApps]
Meter=String
X=(456*#Scale#)
Y=(24*#Scale#)
StringAlign=CenterCenter
FontFace=#Font#
FontSize=(12*#FontScale#)
FontWeight=400
FontColor=#Text#
AntiAlias=1
Text=[\xE71D]
LeftMouseUpAction=["explorer.exe" "shell:AppsFolder"]
ToolTipText=Apps
[BtnFiles]
Meter=Shape
Shape=Ellipse (516*#Scale#),(24*#Scale#),(24*#Scale#) | Fill Color 255,255,255,70 | StrokeWidth (1*#Scale#) | Stroke Color #GlassEdge#
LeftMouseUpAction=["explorer.exe"]
ToolTipText=Files

[IconFiles]
Meter=String
X=(516*#Scale#)
Y=(24*#Scale#)
StringAlign=CenterCenter
FontFace=Segoe Fluent Icons
FontSize=(12*#FontScale#)
FontWeight=400
FontColor=#Text#
AntiAlias=1
Text=[\xE8B7]
LeftMouseUpAction=["explorer.exe"]
ToolTipText=Files
[BtnSettings]
Meter=Shape
Shape=Ellipse (576*#Scale#),(24*#Scale#),(24*#Scale#) | Fill Color 255,255,255,70 | StrokeWidth (1*#Scale#) | Stroke Color #GlassEdge#
LeftMouseUpAction=["ms-settings:"]
ToolTipText=Settings

[IconSettings]
Meter=String
X=(576*#Scale#)
Y=(24*#Scale#)
StringAlign=CenterCenter
FontFace=Segoe Fluent Icons
FontSize=(12*#FontScale#)
FontWeight=400
FontColor=#Text#
AntiAlias=1
Text=[\xE713]
LeftMouseUpAction=["ms-settings:"]
ToolTipText=Settings
[BtnDownloads]
Meter=Shape
Shape=Ellipse (636*#Scale#),(24*#Scale#),(24*#Scale#) | Fill Color 255,255,255,70 | StrokeWidth (1*#Scale#) | Stroke Color #GlassEdge#
LeftMouseUpAction=["explorer.exe" "shell:Downloads"]
ToolTipText=Downloads

[IconDownloads]
Meter=String
X=(636*#Scale#)
Y=(24*#Scale#)
StringAlign=CenterCenter
FontFace=Segoe Fluent Icons
FontSize=(12*#FontScale#)
FontWeight=400
FontColor=#Text#
