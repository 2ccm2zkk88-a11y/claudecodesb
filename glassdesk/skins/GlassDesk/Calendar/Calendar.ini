[Rainmeter]
Update=60000
AccurateText=1

[Metadata]
Name=GlassDesk Calendar
Information=Glass calendar widget sized for a Surface Pro 8.

[Variables]
@Include=#@#Variables.inc

[Script]
Measure=Script
ScriptFile=Calendar.lua

[Background]
