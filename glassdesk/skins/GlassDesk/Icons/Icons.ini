[Rainmeter]
Update=2000
AccurateText=1

[Metadata]
Name=GlassDesk Icons
Information=Your desktop shortcuts, drawn see-through.

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Desktop.inc
; Icon opacity: 0 = invisible, 255 = solid. 128 is about half.
IconAlpha=128
TextAlpha=170

[mDesktop]
Measure=Plugin
Plugin=FileView
Path=#DesktopPath#
ShowDotDot=0
ShowFolder=1
ShowHidden=0
ShowSystem=0
HideExtensions=1
SortType=Name
Count=12

[mName1]
Measure=Plugin
Plugin=FileView
Path=[mDesktop]
Type=FileName
Index=1

[mIcon1]
Measure=Plugin
Plugin=FileView
Path=[mDesktop]
Type=Icon
IconSize=ExtraLarge
IconPath=#@#Icons\icon1.ico
Index=1

[Img1]
Meter=Image
MeasureName=mIcon1
X=((84-48)/2*#Scale#)
Y=((0+6)*#Scale#)
W=(48*#Scale#)
H=(48*#Scale#)
PreserveAspectRatio=1
ImageAlpha=#IconAlpha#
LeftMouseDoubleClickAction=[!CommandMeasure mIcon1 "Open"]
MouseOverAction=[!SetOption Img1 ImageAlpha 255][!UpdateMeter Img1][!Redraw]
MouseLeaveAction=[!SetOption Img1 ImageAlpha #IconAlpha#][!UpdateMeter Img1][!Redraw]

[Label1]
Meter=String
MeasureName=mName1
X=(84/2*#Scale#)
Y=((0+58)*#Scale#)
W=(84*#Scale#)
H=(32*#Scale#)
ClipString=2
StringAlign=Center
FontFace=#Font#
FontSize=(8*#FontScale#)
FontColor=255,255,255,#TextAlpha#
StringEffect=Shadow
FontEffectColor=0,0,0,80
AntiAlias=1
LeftMouseDoubleClickAction=[!CommandMeasure mIcon1 "Open"]

