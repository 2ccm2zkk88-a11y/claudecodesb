[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=GlassDesk Weather
Information=Glass weather widget sized for a Surface Pro 8.

[Variables]
@Include=#@#Variables.inc

[MeasureWeb]
Measure=WebParser
URL=https://wttr.in/#WeatherLocation#?format=%l|%t|%C|%f|%h&#WeatherUnits#
RegExp=(?s)^\s*([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|\r\n]*)
UpdateRate=900
CodePage=65001
UserAgent=curl/8.4.0
FinishAction=[!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetOption Temp Text "--"][!SetOption Condition Text "Offline"][!UpdateMeter *][!Redraw]

[MeasureLocation]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=1
RegExpSubstitute=1
Substitute=",.*$":"","^$":"Weather"

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=2
RegExpSubstitute=1
Substitute="^\+":"","[FC]$":""

[MeasureCondition]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=3

[MeasureFeels]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=4
RegExpSubstitute=1
Substitute="^\+":"","[FC]$":""

[MeasureHumidity]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=5

[Background]
Meter=Shape
Shape=Rectangle 0,0,(300*#Scale#),(130*#Scale#),(#Radius#*#Scale#) | Fill Color #Glass# | StrokeWidth (1*#Scale#) | Stroke Color #GlassEdge#
LeftMouseUpAction=[!CommandMeasure MeasureWeb "Update"]
ToolTipText=Click to refresh

[Location]
Meter=String
X=(20*#Scale#)
Y=(16*#Scale#)
StringAlign=Left
FontFace=#Font#
FontSize=(11*#FontScale#)
FontWeight=600
FontColor=#Text#
AntiAlias=1
Text=
MeasureName=MeasureLocation
[Temp]
Meter=String
X=(18*#Scale#)
Y=(34*#Scale#)
StringAlign=Left
FontFace=#Font#
FontSize=(34*#FontScale#)
FontWeight=300
FontColor=#Text#
AntiAlias=1
Text=%1
MeasureName=MeasureTemp
[Condition]
Meter=String
X=(280*#Scale#)
Y=(52*#Scale#)
StringAlign=Right
FontFace=#Font#
FontSize=(10*#FontScale#)
FontWeight=600
FontColor=#Text#
AntiAlias=1
Text=%1
MeasureName=MeasureCondition
ClipString=1
W=(150*#Scale#)
[Details]
Meter=String
X=(280*#Scale#)
Y=(74*#Scale#)
StringAlign=Right
FontFace=#Font#
FontSize=(8*#FontScale#)
FontWeight=400
FontColor=#TextDim#
AntiAlias=1
Text=Feels %1  [\xB7]  Humidity %2
MeasureName=MeasureFeels
MeasureName2=MeasureHumidity
[Hint]
Meter=String
X=(20*#Scale#)
Y=(104*#Scale#)
StringAlign=Left
FontFace=#Font#
FontSize=(7*#FontScale#)
FontWeight=400
FontColor=#TextDim#
AntiAlias=1
Text=Updates every 15 min. Click to refresh.

